<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L13</title><style>body{background:#FFF9E6;text-align:center;font-family:sans-serif;padding:15px}.card{max-width:360px;margin:14px auto;background:white;border-radius:20px;border:3px solid #FFAB91;padding:30px 10px;min-height:220px}.big{font-size:48px;font-weight:900}.mid{font-size:30px;font-weight:800;margin-top:10px}.arti{font-size:28px;font-weight:800;color:#FF7043;margin-top:10px}.btn{padding:12px 10px;border-radius:12px;border:none;font-weight:800;margin:4px}.b1{background:white;border:2px solid #FF7043;color:#FF7043}.b2{background:#FFE0B2;border:2px solid #FFB74D}.b3{background:#FF7043;color:white;width:100%;padding:14px;font-size:16px}.nav{display:flex;gap:8px;max-width:360px;margin:12px auto}.nav button{flex:1;padding:12px;border-radius:12px;border:2px solid #FFCCBC;background:white;color:#FF7043;font-weight:800}</style></head><body><h3>L13 - Kanji Kotoba</h3><div id="cnt">1/21</div><div class="card"><div id="kanji" class="big">公共</div><div id="kotoba" class="mid" style="display:none">こうきょう</div><div id="arti" class="arti" style="display:none">publik</div></div><button class="btn b1" onclick="showKanji()">KANJI</button><button class="btn b2" onclick="showKotoba()">KOTOBA</button><button class="btn b3" onclick="showArti()">LIHAT ARTI</button><div class="nav"><button onclick="prev()">◀ Prev</button><button onclick="next()">Next ▶</button></div><script>d=[["公共","こうきょう","publik"],["施設","しせつ","fasilitas"],["図書館","としょかん","perpustakaan"],["美術館","びじゅつかん","museum seni"],["体育館","たいいくかん","gedung olahraga"],["スポーツジム","スポーツジム","gym"],["お風呂","おふろ","pemandian"],["券売機","けんばいき","mesin tiket"],["休憩室","きゅうけいしつ","ruang istirahat"],["入館","にゅうかん","masuk gedung"],["ロッカー","ロッカー","loker"],["シャワー","シャワー","shower"],["利用する","りようする","menggunakan"],["展示する","てんじする","memamerkan"],["確認する","かくにんする","mengecek"],["返す","かえす","mengembalikan"],["預ける","あずける","menitipkan"],["資料","しりょう","bahan"],["入館料","にゅうかんりょう","biaya masuk"],["無料","むりょう","gratis"]];i=0;function upd(){document.getElementById('kanji').textContent=d[i][0];document.getElementById('kotoba').textContent=d[i][1];document.getElementById('arti').textContent=d[i][2];document.getElementById('cnt').textContent=(i+1)+'/'+d.length;showKanji()}function showKanji(){document.getElementById('kanji').style.display='block';document.getElementById('kotoba').style.display='none';document.getElementById('arti').style.display='none'}function showKotoba(){document.getElementById('kanji').style.display='none';document.getElementById('kotoba').style.display='block';document.getElementById('arti').style.display='none'}function showArti(){document.getElementById('kanji').style.display='none';document.getElementById('kotoba').style.display='none';document.getElementById('arti').style.display='block'}function next(){i=(i+1)%d.length;upd()}function prev(){i=(i-1+d.length)%d.length;upd()}upd();</script></body></html>
