<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>L13 Swipe</title><style>
*{touch-action:pan-y}
body{background:#000;color:white;font-family:'Courier New',monospace;text-align:center;padding:0;margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.wrap{width:92%;max-width:380px}
.card{width:100%;aspect-ratio:1/1.15;background:#111;border:1.5px solid #555;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;margin:0 auto 18px auto;transition:transform 0.25s ease, opacity 0.25s ease;will-change:transform;user-select:none}
.kanji{font-size:42px;font-weight:800;pointer-events:none}
.kana{font-size:32px;font-weight:800;margin-top:8px;pointer-events:none}
.arti{font-size:18px;color:#aaa;margin-top:16px;pointer-events:none}
.hint{font-size:10px;color:#444;margin-top:12px;pointer-events:none}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:14px;border-radius:12px;border:1.5px solid;background:black;font-family:'Courier New',monospace;font-weight:700;font-size:12px}
.b-random{border-color:white;color:white}
.b-hafal{border-color:#00ff88;color:#00ff88}
.b-menu{border-color:#ff4444;color:#ff6666;grid-column:1/3}
.counter{font-size:11px;color:#666;margin-bottom:6px}
.progress{font-size:10px;color:#00ff88;margin-bottom:10px}
.swipe-hint{font-size:9px;color:#333;margin-top:10px}
</style></head><body><div class="wrap">
<div class="counter" id="counter">1 / 88</div>
<div class="progress" id="progress">Hafal: 0 | Sisa: 88</div>
<div class="card" id="card"><div class="kanji" id="kanji"></div><div class="kana" id="kana"></div><div class="arti" id="arti"></div><div class="hint" id="hint">tap = arti | geser = ganti</div></div>
<div class="btns">
<button class="btn b-random" onclick="acak()">🎲 Acak Kartu</button>
<button class="btn b-hafal" onclick="hafal()">✅ Sudah Hafal</button>
<button class="btn b-menu" onclick="reset()">← Kembali ke Menu</button>
</div>
<div class="swipe-hint">👉 Geser kiri/kanan pake jari buat ganti kartu</div>
</div>
<script>
let original=[["公共","こうきょう","publik"],["施設","しせつ","fasilitas"],["図書館","としょかん","perpustakaan"],["美術館","びじゅつかん","museum seni"],["民俗資料館","みんぞくしりょうかん","museum rakyat"],["体育館","たいいくかん","gedung olahraga"],["スポーツジム","スポーツジム","pusat kebugaran"],["お風呂","おふろ","ruang berendam"],["入浴施設","にゅうよくしせつ","ruang mandi"],["インフォメーションコーナー","インフォメーションコーナー","ruang informasi"],["プラネタリウム","プラネタリウム","planetarium"],["物産コーナー","ぶっさんコーナー","pojok produk"],["市内","しない","dalam kota"],["パンフレット","パンフレット","pamflet"],["外国語","がいこくご","bahasa asing"],["CD","シーディー","CD"],["昔","むかし","dahulu"],["道具","どうぐ","peralatan"],["文化施設","ぶんかしせつ","pusat kebudayaan"],["建てる","たてる","mendirikan"],["メイン","メイン","utama"],["PC","ピーシー","komputer"],["自由に","じゆうに","dengan bebas"],["展示する","てんじする","memamerkan"],["歴史","れきし","sejarah"],["利用する","りようする","menggunakan"],["室内用","しつないよう","untuk dalam ruangan"],["オリエンテーション","オリエンテーション","orientasi"],["延長料金","えんちょうりょうきん","biaya perpanjangan"],["～につき","～につき","untuk setiap ~"],["かかる","かかる","dikenakan biaya"],["下りる","おりる","turun"],["シューズ","シューズ","sepatu"],["マシン","マシン","mesin"],["トレーナー","トレーナー","pelatih"],["～ほど","～ほど","sekitar ~"],["受ける","うける","menerima"],["声をかける","こえをかける","menyapa"],["ご了承ください","ごりょうしょうください","Mohon dipahami"],["受けていただきます","うけていただきます","mohon untuk mengikuti"],["絵","え","lukisan"],["さまざまな","さまざまな","berbagai macam"],["彫刻","ちょうこく","ukiran"],["画家","がか","pelukis"],["～を中心に","～をちゅうしんに","utamanya"],["セット券","セットけん","tiket terusan"],["フラッシュ","フラッシュ","lampu kilat"],["券売機","けんばいき","mesin tiket"],["休憩室","きゅうけいしつ","ruang santai"],["ついている","ついている","termasuk"],["IT","アイティー","IT"],["利用者カード","りようしゃカード","kartu pengguna"],["プリントアウト","プリントアウト","print-out"],["インターネット","インターネット","internet"],["プリンター","プリンター","printer"],["空いている","あいている","kosong"],["確認する","かくにんする","mengecek"],["在留カード","ざいりゅうカード","kartu izin tinggal"],["何冊","なんさつ","berapa jilid"],["～冊","～さつ","~ jilid"],["合わせて","あわせて","total"],["～点","～てん","~ buah"],["飲食禁止","いんしょくきんし","larangan makan minum"],["返す","かえす","mengembalikan"],["閉まる","しまる","tutup"],["返却ポスト","へんきゃくポスト","kotak pengembalian"],["開く","あく","buka"],["返却","へんきゃく","pengembalian"],["お読みください","およみください","Silakan baca"],["延ばす","のばす","memperpanjang"],["～のうち","～のうち","dalam ~"],["カセットテープ","カセットテープ","kaset"],["～禁止","～きんし","larangan ~"],["立入禁止","たちいりきんし","larangan masuk"],["関係者","かんけいしゃ","staf"],["～以外","～いがい","kecuali ~"],["預ける","あずける","menitipkan"],["お預けください","おあずけください","Silakan titip"],["館内","かんない","dalam gedung"],["通話","つうわ","telepon"],["ご遠慮ください","ごえんりょください","Mohon jangan"],["お控えください","おひかえください","Mohon jangan"],["入館","にゅうかん","masuk gedung"],["入れ墨","いれずみ","tato Jepang"],["タトゥー","タトゥー","tato"],["シール","シール","stiker tato"],["ボディペイント","ボディペイント","body paint"],["お断りしています","おことわりしています","Kami menolak"]];
let deck=[...original],hafalList=[],idx=0,show=0;
let startX=0,currentX=0,isDragging=false;
const card=document.getElementById('card');
function render(){if(deck.length==0){kanji.textContent='🎉';kana.textContent='Selesai!';arti.textContent='88 kata hafal!';hint.textContent='';return}let d=deck[idx];if(show==0){kanji.textContent=d[0];kana.textContent='';arti.textContent='';hint.textContent='tap = arti | geser = ganti'}else{kanji.textContent=d[0];kana.textContent=d[1];arti.textContent=d[2];hint.textContent='tap = tutup'}counter.textContent=(idx+1)+' / '+deck.length;progress.textContent='Hafal: '+hafalList.length+' | Sisa: '+deck.length}
function nextCard(){if(deck.length==0)return;card.style.transform='translateX(-120%)';card.style.opacity='0';setTimeout(()=>{idx=(idx+1)%deck.length;show=0;card.style.transition='none';card.style.transform='translateX(120%)';setTimeout(()=>{card.style.transition='transform 0.25s ease, opacity 0.25s ease';card.style.transform='translateX(0)';card.style.opacity='1';render()},20)},200)}
function prevCard(){if(deck.length==0)return;card.style.transform='translateX(120%)';card.style.opacity='0';setTimeout(()=>{idx=(idx-1+deck.length)%deck.length;show=0;card.style.transition='none';card.style.transform='translateX(-120%)';setTimeout(()=>{card.style.transition='transform 0.25s ease, opacity 0.25s ease';card.style.transform='translateX(0)';card.style.opacity='1';render()},20)},200)}
function flip(){if(isDragging)return;show=show==0?1:0;render()}
card.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;isDragging=false;card.style.transition='none'},{passive:true});
card.addEventListener('touchmove',e=>{currentX=e.touches[0].clientX;let diff=currentX-startX;if(Math.abs(diff)>10)isDragging=true;card.style.transform=`translateX(${diff}px) rotate(${diff*0.05}deg)`;card.style.opacity=1-Math.abs(diff)/300},{passive:true});
card.addEventListener('touchend',e=>{let diff=currentX-startX;card.style.transition='transform 0.25s ease, opacity 0.25s ease';if(Math.abs(diff)>80){if(diff<0)nextCard();else prevCard()}else{card.style.transform='translateX(0)';card.style.opacity='1';if(!isDragging)flip()}setTimeout(()=>isDragging=false,100)},{passive:true});
card.addEventListener('mousedown',e=>{startX=e.clientX;isDragging=false;card.style.transition='none'});
window.addEventListener('mousemove',e=>{if(startX==0)return;currentX=e.clientX;let diff=currentX-startX;if(Math.abs(diff)>10)isDragging=true;card.style.transform=`translateX(${diff}px) rotate(${diff*0.05}deg)`});
window.addEventListener('mouseup',e=>{if(startX==0)return;let diff=currentX-startX;card.style.transition='transform 0.25s ease, opacity 0.25s ease';if(Math.abs(diff)>80){if(diff<0)nextCard();else prevCard()}else{card.style.transform='translateX(0)';card.style.opacity='1';if(!isDragging&&e.target.closest('#card'))flip()}startX=0;setTimeout(()=>isDragging=false,100)});
function acak(){for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;show=0;render()}
function hafal(){if(deck.length==0)return;card.style.transform='translateY(-120%) scale(0.8)';card.style.opacity='0';setTimeout(()=>{hafalList.push(deck[idx]);deck.splice(idx,1);if(idx>=deck.length)idx=0;show=0;card.style.transition='none';card.style.transform='translateY(120%)';setTimeout(()=>{card.style.transition='transform 0.25s ease, opacity 0.25s ease';card.style.transform='translateY(0)';card.style.opacity='1';render()},30)},200)}
function reset(){if(confirm('Reset ke 88 kata?')){deck=[...original];hafalList=[];idx=0;show=0;render()}}
render();
</script></body></html>
