const P1=FULL.slice(0,44),P2=FULL.slice(44),MAP={FULL,P1,P2};
let cur=[],idx=0,show=false,furi=false,hafalCount=0,sx=0,cx=0,drag=false;
function start(k){cur=[...MAP[k]];idx=0;show=false;hafalCount=0;document.getElementById('menuPage').classList.add('hidden');let p=document.getElementById('playPage');p.classList.remove('hidden');p.style.display='flex';render()}
function goMenu(){document.getElementById('playPage').classList.add('hidden');document.getElementById('menuPage').classList.remove('hidden')}
function render(){let d=cur[idx];document.getElementById('w').textContent=d[0];document.getElementById('k').textContent=d[1];document.getElementById('m').textContent=d[2];document.getElementById('k').style.display=(show&&furi)?'block':'none';document.getElementById('m').style.display=show?'block':'none';document.getElementById('hint').style.display=show?'none':'block';document.getElementById('counter').textContent=(idx+1)+' / '+cur.length;document.getElementById('footer').textContent='Hafal: '+hafalCount+' | Sisa: '+cur.length+' | swipe kiri/kanan = ganti'}
function toggleFuri(){furi=!furi;document.getElementById('fl').textContent=furi?'ON':'OFF';render()}
const card=document.getElementById('card'),wrap=document.getElementById('wrap');
card.addEventListener('click',()=>{if(drag)return;show=!show;render()});
function acak(){for(let i=cur.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cur[i],cur[j]]=[cur[j],cur[i]]}idx=0;show=false;render()}
function hafal(){hafalCount++;cur.splice(idx,1);if(cur.length==0){alert('Hafal semua!');goMenu();return}if(idx>=cur.length)idx=0;show=false;anim(1)}
wrap.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;drag=true},{passive:true});
wrap.addEventListener('touchmove',e=>{if(!drag)return;cx=e.touches[0].clientX-sx;card.style.transform='translateX('+cx+'px) rotate('+(cx*0.04)+'deg)';card.style.opacity=1-Math.abs(cx)/300},{passive:true});
wrap.addEventListener('touchend',()=>{drag=false;if(Math.abs(cx)>80){if(cx<0)idx=(idx+1)%cur.length;else idx=(idx-1+cur.length)%cur.length;show=false;anim(cx<0?-1:1)}else{card.style.transform='translateX(0)';card.style.opacity=1}cx=0});
function anim(d){card.style.transition='transform.28s ease,opacity.28s ease';card.style.transform='translateX('+(d*400)+'px)';card.style.opacity=0;setTimeout(()=>{card.style.transition='none';card.style.transform='translateX('+(-d*400)+'px)';render();requestAnimationFrame(()=>{card.style.transition='transform.28s ease,opacity.28s ease';card.style.transform='translateX(0)';card.style.opacity=1})},280)}
