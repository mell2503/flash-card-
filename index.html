<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcard L13</title>
<style>
body{font-family:sans-serif;background:#FFF7E1;margin:0;padding:15px;text-align:center}
.card{width:100%;max-width:360px;height:300px;margin:20px auto;perspective:1000px}
.inner{width:100%;height:100%;position:relative;transition:.6s;transform-style:preserve-3d;cursor:pointer}
.card.flip.inner{transform:rotateY(180deg)}
.front,.back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;box-shadow:0 8px 18px rgba(0,0,0,.2)}
.front{background:#fff;border:3px solid #FF8A65}
.back{background:#FF7043;color:#fff;transform:rotateY(180deg)}
.jp{font-size:36px;font-weight:bold}
.yomi{color:#E64A19;margin-top:8px}
.mean{font-size:22px;font-weight:bold}
button{padding:12px 18px;border-radius:25px;border:none;background:#FF7043;color:#fff;margin:5px;font-weight:bold}
.prog{background:#FFE0B2;padding:6px 14px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
<h2>L13 いろいろな資料を展示してあります</h2>
<div class="prog" id="prog"></div>
<div class="card" id="card" onclick="this.classList.toggle('flip')">
<div class="inner">
<div class="front"><div class="jp" id="jp"></div><div class="yomi" id="yomi"></div><small>tap untuk balik</small></div>
<div class="back"><div class="mean" id="mean"></div><small>tap lagi</small></div>
</div>
</div>
<div>
<button onclick="prev()">⬅️ Prev</button>
<button onclick="next()">Next ➡️</button>
</div>
<script>
const data=[
{"jp":"公共","yomi":"こうきょう","id":"publik"},
{"jp":"施設","yomi":"しせつ","id":"fasilitas"},
{"jp":"図書館","yomi":"としょかん","id":"perpustakaan"},
{"jp":"美術館","yomi":"びじゅつかん","id":"museum seni"},
{"jp":"民俗資料館","yomi":"みんぞくしりょうかん","id":"museum cerita rakyat"},
{"jp":"体育館","yomi":"たいいくかん","id":"gedung olahraga"},
{"jp":"スポーツジム","yomi":"スポーツジム","id":"gym"},
{"jp":"お風呂","yomi":"おふろ","id":"pemandian"},
{"jp":"入浴施設","yomi":"にゅうよくしせつ","id":"fasilitas mandi"},
{"jp":"プラネタリウム","yomi":"プラネタリウム","id":"planetarium"},
{"jp":"パンフレット","yomi":"パンフレット","id":"pamflet"},
{"jp":"展示する","yomi":"てんじする","id":"memamerkan"},
{"jp":"利用する","yomi":"りようする","id":"menggunakan"},
{"jp":"延長料金","yomi":"えんちょうりょうきん","id":"biaya perpanjangan"},
{"jp":"確認する","yomi":"かくにんする","id":"mengecek"},
{"jp":"返す","yomi":"かえす","id":"mengembalikan"},
{"jp":"預ける","yomi":"あずける","id":"menitipkan"},
{"jp":"券売機","yomi":"けんばいき","id":"mesin tiket"},
{"jp":"休憩室","yomi":"きゅうけいしつ","id":"ruang istirahat"},
{"jp":"入館","yomi":"にゅうかん","id":"masuk gedung"}
];
let i=0;
function show(){document.getElementById('jp').innerText=data[i].jp;document.getElementById('yomi').innerText=data[i].yomi;document.getElementById('mean').innerText=data[i].id;document.getElementById('prog').innerText=(i+1)+'/'+data.length;document.getElementById('card').classList.remove('flip');}
function next(){i=(i+1)%data.length;show();}
function prev(){i=(i-1+data.length)%data.length;show();}
show();
</script>
</body>
  </html>
